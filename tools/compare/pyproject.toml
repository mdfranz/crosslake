[project]
name = "crosslake-compare"
version = "0.1.0"
description = "DuckDB-based size/schema/query comparison across CloudTrail S3 JSON, GCS Parquet (Tier 2), and GCS Avro (Tier 3)."
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.1",
    "fastavro>=1.12.2",
    "logfire>=2.0",
    "pyarrow>=25.0.1",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compare"]
